<app-auth-arka-plan>
  <!-- Sol: Flat Design "şifremi unuttum" formu - login.html ile AYNI kutu/stil (bkz.
       sifremi-unuttum.css üst yorumu). -->
  <div class="login-form-flat">
    @if (!gonderildi()) {
      <div>
        <h2>{{ 'sifremiUnuttum.baslik' | translate }}</h2>
        <p class="login-form-sub">{{ 'sifremiUnuttum.altBaslik' | translate }}</p>
      </div>

      <div class="field">
        <label for="email">{{ 'sifremiUnuttum.email' | translate }}</label>
        <dx-text-box id="email" mode="email" [value]="email()" (onValueChanged)="email.set($event.value ?? '')"
          (onEnterKey)="gonder()"></dx-text-box>
      </div>

      @if (hataMesaji()) {
      <p class="error-text">{{ hataMesaji() }}</p>
      }

      <dx-button class="login-buton"
        [text]="(gonderiliyor() ? 'sifremiUnuttum.gonderiliyor' : 'sifremiUnuttum.gonder') | translate"
        type="default" width="100%" [disabled]="gonderiliyor()" (onClick)="gonder()"></dx-button>
    } @else {
      <div>
        <h2>{{ 'sifremiUnuttum.kontrolEt' | translate }}</h2>
        <p class="login-form-sub">{{ sonucMesaji() }}</p>
      </div>
    }

    <p class="login-form-foot"><a routerLink="/login">← {{ 'sifremiUnuttum.girisDon' | translate }}</a></p>
  </div>
</app-auth-arka-plan>
