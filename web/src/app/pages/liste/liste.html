<section class="panel panel-form">
  <div class="panel-head"><span class="panel-eyebrow">Yeni Kayıt Ekle</span></div>
  <div class="field-row">
    <div class="field">
      <label for="wizardPlaka">1. Plaka</label>
      <dx-select-box
        id="wizardPlaka"
        [dataSource]="plakalar()"
        displayExpr="aracPlaka"
        valueExpr="aracId"
        placeholder="— Seçiniz —"
        [value]="wizardAracId"
        (onValueChanged)="wizardPlakaDegisti($event)"
        width="200"
      ></dx-select-box>
    </div>

    @if (wizardAracId != null) {
      <div class="field">
        <label for="wizardTarih">2. Veri Tarihi</label>
        <dx-date-box
          id="wizardTarih"
          type="date"
          pickerType="calendar"
          displayFormat="dd.MM.yyyy"
          [value]="wizardTarihDate"
          (onValueChanged)="wizardTarihDegisti($event)"
          width="160"
        ></dx-date-box>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <dx-button
          text="Tarihi Onayla →"
          type="normal"
          stylingMode="outlined"
          [disabled]="sinirlarHesaplaniyor()"
          (onClick)="tarihiOnayla()"
        ></dx-button>
      </div>
    }

    @if (tarihOnaylandi()) {
      <div class="field">
        <label for="wizardHiz">3. Hız</label>
        <dx-number-box
          id="wizardHiz"
          [min]="0"
          [max]="300"
          [value]="wizardHiz"
          (onValueChanged)="wizardHiz = $event.value ?? 0"
          width="90"
        ></dx-number-box>
      </div>
      <div class="field">
        <label for="wizardKm">4. Km Sayacı</label>
        <dx-number-box
          id="wizardKm"
          format="#,##0.00"
          [min]="kmMin()"
          [max]="kmMax()"
          [value]="wizardKm"
          (onValueChanged)="wizardKm = $event.value ?? 0"
          width="150"
        ></dx-number-box>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <dx-button
          text="Ekle"
          type="default"
          [disabled]="!ekleEtkin() || ekleniyor()"
          (onClick)="ekle()"
        ></dx-button>
      </div>
    }
  </div>

  @if (sinirBilgisi()) {
    <p class="status-text" style="white-space: pre-line; margin-top: 0.75rem">{{ sinirBilgisi() }}</p>
  }
</section>

<section class="panel">
  <div class="panel-head"><span class="panel-eyebrow">Araç Hareketleri</span></div>

  <!-- Filtre alanları VE tüm aksiyon butonları TEK bir satırda (2026-08-07 geri bildirimi:
       "hiçbir buton alt satıra geçmeyecek, hepsi input'larla aynı tek satırda kalacak") - eskiden
       Filtre ve Araç Hareketleri ayrı panellerdi, şimdi tek panelin tek satırlık araç çubuğu.
       flex-wrap:nowrap KESİN tek satırı garanti ediyor; çok dar ekranlarda (bu, masaüstü odaklı
       bir iç sistem olduğu için normalde beklenmiyor) satır kırılmak yerine yatay kaydırılıyor. -->
  <div class="filtre-toolbar">
    <div class="field">
      <label for="filtrePlaka">Plaka (birden fazla seçebilirsiniz)</label>
      <dx-tag-box
        id="filtrePlaka"
        [dataSource]="filtrePlakaListesi()"
        placeholder="Tümü"
        [searchEnabled]="true"
        [showSelectionControls]="true"
        [multiline]="false"
        [value]="filtreSeciliPlakalar()"
        (onValueChanged)="filtreSeciliPlakalarDegisti($event)"
        width="220"
      ></dx-tag-box>
    </div>
    <div class="field">
      <label for="filtreTarih">Tarih Aralığı</label>
      <div style="display: flex; align-items: center; gap: 0.4rem">
        <dx-check-box [value]="filtreTarihAktif" (onValueChanged)="filtreTarihAktif = !!$event.value"></dx-check-box>
        <dx-date-range-box
          id="filtreTarih"
          [startDate]="filtreBaslangicDate"
          (startDateChange)="filtreBaslangicDateDegisti($event)"
          [endDate]="filtreBitisDate"
          (endDateChange)="filtreBitisDateDegisti($event)"
          startDatePlaceholder="Başlangıç"
          endDatePlaceholder="Bitiş"
          labelMode="hidden"
          displayFormat="dd.MM.yyyy"
          [showClearButton]="false"
          [disabled]="!filtreTarihAktif"
          width="220"
        ></dx-date-range-box>
      </div>
    </div>
    <div class="field">
      <label for="filtreHiz">Hız</label>
      <dx-number-box
        id="filtreHiz"
        [showClearButton]="true"
        [value]="$any(filtreHiz)"
        (onValueChanged)="filtreHiz = $event.value ?? null"
        width="90"
      ></dx-number-box>
    </div>
    <div class="field">
      <label for="filtreKm">Km Sayacı</label>
      <dx-number-box
        id="filtreKm"
        format="#,##0.00"
        [showClearButton]="true"
        [value]="$any(filtreKm)"
        (onValueChanged)="filtreKm = $event.value ?? null"
        width="120"
      ></dx-number-box>
    </div>

    <div class="filtre-toolbar-actions">
      <dx-button text="Filtrele" type="default" (onClick)="filtreleUygula()"></dx-button>
      <dx-button text="Temizle" type="normal" stylingMode="outlined" (onClick)="filtreleTemizle()"></dx-button>
      <dx-button text="Yenile" type="normal" stylingMode="outlined" (onClick)="refreshGrid()"></dx-button>
      <dx-button text="Sil" type="danger" [disabled]="!seciliHareket()" (onClick)="sil()"></dx-button>
      <input #importDosyaSecici type="file" accept=".xlsx" hidden (change)="excelDenAktarSecildi($event)" />
      <dx-button
        text="Excel'den Veri Aktar"
        type="normal"
        stylingMode="outlined"
        (onClick)="importDosyaSecici.click()"
      ></dx-button>
    </div>
  </div>
  @if (filtreHatasi()) {
    <p class="error-text" style="margin-top: 0.5rem">{{ filtreHatasi() }}</p>
  }

  <dx-data-grid
    [dataSource]="gosterilenHareketler()"
    [columns]="dataGridColumns"
    [showBorders]="true"
    [showColumnLines]="true"
    [showRowLines]="true"
    [rowAlternationEnabled]="true"
    [selection]="{ mode: 'single' }"
    [paging]="{ pageSize: ilkSayfaBoyutu }"
    [pager]="{
      visible: true,
      showPageSizeSelector: true,
      allowedPageSizes: sayfaBoyutuSecenekleri,
      showInfo: true,
      showNavigationButtons: true
    }"
    [searchPanel]="{ visible: true, placeholder: 'Ara...' }"
    [export]="{ enabled: true }"
    (onSelectionChanged)="onSelectionChanged($event)"
    (onExporting)="onExporting($event)"
  ></dx-data-grid>

  <p class="status-text" style="margin-top: 0.75rem">{{ statusText() }}</p>
</section>
