<section class="panel panel-form">
  <div class="panel-head"><span class="panel-eyebrow">{{ 'admin.baslikYeniKullanici' | translate }}</span></div>
  <div class="field-row">
    <div class="field">
      <label for="yeniKullaniciAdi">{{ 'admin.kolonKullaniciAdi' | translate }}</label>
      <dx-text-box
        id="yeniKullaniciAdi"
        [value]="yeniKullaniciAdi"
        (onValueChanged)="yeniKullaniciAdi = $event.value ?? ''"
        width="180"
      ></dx-text-box>
    </div>
    <div class="field">
      <label for="yeniSifre">{{ 'sifreSifirla.yeniSifre' | translate }}</label>
      <dx-text-box
        id="yeniSifre"
        mode="password"
        [value]="yeniSifre"
        (onValueChanged)="yeniSifre = $event.value ?? ''"
        width="180"
      ></dx-text-box>
    </div>
    <div class="field">
      <label for="yeniEmail">{{ 'admin.kolonEmail' | translate }}</label>
      <dx-text-box
        id="yeniEmail"
        mode="email"
        [value]="yeniEmail"
        (onValueChanged)="yeniEmail = $event.value ?? ''"
        width="200"
      ></dx-text-box>
    </div>
    <div class="field">
      <label for="yeniRol">{{ 'admin.kolonRol' | translate }}</label>
      <dx-select-box
        id="yeniRol"
        [dataSource]="rolSecenekleri"
        [value]="yeniRol"
        (onValueChanged)="yeniRol = $event.value ?? 'Viewer'"
        width="140"
      ></dx-select-box>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <dx-button
        [text]="(ekleniyor() ? 'admin.ekleniyor' : 'admin.ekle') | translate"
        type="default"
        [disabled]="ekleniyor()"
        (onClick)="ekle()"
      ></dx-button>
    </div>
  </div>
</section>

<section class="panel">
  <div class="panel-head">
    <span class="panel-eyebrow">{{ 'admin.kullanicilar' | translate }}</span>
    <span class="panel-actions">
      <dx-button
        [text]="'admin.sil' | translate"
        type="danger"
        [disabled]="!seciliKullanici() || kendisiSecilmiMi"
        (onClick)="sil()"
      ></dx-button>
    </span>
  </div>

  <dx-data-grid
    [dataSource]="kullanicilar()"
    [columns]="dataGridColumns()"
    [showBorders]="true"
    [showColumnLines]="true"
    [showRowLines]="true"
    [rowAlternationEnabled]="true"
    [selection]="{ mode: 'single' }"
    [searchPanel]="{ visible: true, placeholder: ('admin.araPlaceholder' | translate) }"
    (onSelectionChanged)="onSelectionChanged($event)"
  ></dx-data-grid>

  <p class="status-text" style="margin-top: 0.75rem">{{ statusText() }}</p>
  @if (kendisiSecilmiMi) {
    <p class="status-text" style="margin-top: 0.25rem">{{ 'admin.kendiHesabiniSilemezsin' | translate }}</p>
  }
</section>

<section class="panel">
  <div class="panel-head"><span class="panel-eyebrow">{{ 'admin.logEkrani' | translate }}</span></div>
  <p class="status-text">{{ 'admin.logAciklama' | translate }}</p>
  <a href="http://localhost:9000" target="_blank" rel="noopener">
    <dx-button [text]="('admin.graylogAc' | translate) + ' ↗'" type="normal" stylingMode="outlined"></dx-button>
  </a>
</section>
