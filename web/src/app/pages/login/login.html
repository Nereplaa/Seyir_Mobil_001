<app-auth-arka-plan>
  <!-- Sol: Flat Design giriş formu -->
  <div class="login-form-flat">
    <div>
      <h2>{{ 'login.baslik' | translate }}</h2>
      <p class="login-form-sub">{{ 'login.altBaslik' | translate }}</p>
    </div>

    <div class="field">
      <label for="username">{{ 'login.kullaniciAdi' | translate }}</label>
      <dx-text-box id="username" [value]="username()" (onValueChanged)="username.set($event.value ?? '')"
        (onEnterKey)="girisYap()"></dx-text-box>
    </div>

    <div class="field">
      <label for="password">{{ 'login.sifre' | translate }}</label>
      <dx-text-box id="password" mode="password" [value]="password()"
        (onValueChanged)="password.set($event.value ?? '')" (onEnterKey)="girisYap()"></dx-text-box>
    </div>

    @if (hataMesaji()) {
    <p class="error-text">{{ hataMesaji() }}</p>
    }

    <dx-button class="login-buton" [text]="(girisYapiliyor() ? 'login.girisYapiliyor' : 'login.girisYap') | translate"
      type="default" width="100%" [disabled]="girisYapiliyor()" (onClick)="girisYap()"></dx-button>

    <p class="login-form-foot">
      <a routerLink="/sifremi-unuttum">{{ 'login.sifremiUnuttum' | translate }}</a> · {{ 'login.erisimSorunu' |
      translate }}
    </p>
  </div>
</app-auth-arka-plan>
