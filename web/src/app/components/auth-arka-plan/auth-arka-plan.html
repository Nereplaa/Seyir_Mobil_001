<div class="login-canvas">
  <!-- Dil seçici (2026-08-12) - header burada gizli olduğu için (bkz. app.ts loginEkraninda),
       auth ekranlarının kendi köşesinde ayrı bir seçici var. -->
  <dx-select-box class="login-dil-secici" [dataSource]="dilSecenekleri" displayExpr="etiket" valueExpr="kod"
    [value]="dil.guncelDil" (onValueChanged)="dilDegistir($event.value)" width="72"></dx-select-box>

  <!-- Sol üst köşe: marka yazısı + pusula logosu (2026-08-13 - logo, sağdaki ağın merkezindeki
       pusulayla AYNI SVG yolu, sadece küçültülüp yazının soluna eklendi). -->
  <div class="login-wordmark">
    <svg class="login-wordmark-logo" width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.4" />
      <path d="M15.5 8.5 L11 11 L8.5 15.5 L13 13 Z" fill="currentColor" />
    </svg>
    <div class="login-wordmark-text">
      <span class="login-wordmark-line">Seyir</span>
      <span class="login-wordmark-line">Mobil</span>
    </div>
  </div>

  <!-- Arka plan: KUSURSUZ ÇEMBER siluetli 10 kollu ağ (2026-08-13 dokuzuncu tur - önceki "%5
       dikdörtgen sınır" kuralı TAMAMEN İPTAL EDİLDİ, dikdörtgen taşma önleme mantığı bırakıldı).
       Merkez `(848,400)`, yarıçap `R=320` - form ile ekranın sağ kenarı arasındaki boşluğun tam
       ortasına, boşluktan (soldan forma ~32px, sağdan ekran kenarına ~32px) taşmayacak şekilde
       yerleştirildi (viewBox 1200x800 üzerinden: form kenarı ~x=496, ekran sağ kenarı x=1200 →
       boşluk ortası (496+1200)/2=848, `R=320` her iki yandan da bu boşluğa sığıyor). TÜM uç
       noktalar (ana kollar + dallanan alt kollar) BİREBİR bu çemberin üzerinde -
       `x=848+320·cos(açı)`, `y=400+320·sin(açı)` formülüyle hesaplandı, dikdörtgen kenarlarına
       göre DEĞİL. 10 kol + 32°-48° asimetrik açı dağılımı (`[-90°,-55°,-15°,17°,55°,91°,124°,
       163°,197°,234°]`, gap dizisi `[35,40,32,38,36,33,39,34,37,36]`) ve 5 koldaki (Kol
       1/3/5/7/9) dallanma korundu - dallanma noktası merkeze yarıçapın `%55`'inde (`r=176`) bir
       iç çember üzerinde, oradan çıkan 2 alt kol ±13° açı farkıyla YİNE dış (R=320) çembere
       değiyor - trunk'ın bitiş teğetiyle sub'ların başlangıç teğeti sadece 13° farklı olduğu
       için çatal keskin bir 'V' değil, yumuşak bir ayrışma. Dalgalanma formülü (2 ardışık C,
       genlik uzunluğun ~%18'i, 65px tavan) değişmedi. -->
  <svg class="login-route-bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <!-- Kol 1 (-90°, K) - dallanıyor: iç çemberden (176,180°) sonra dış çembere (320) ±13°'lik 2 uçla değiyor -->
    <path class="route-ray route-ray-a" d="M848 400 C 880 342, 816 284, 848 312 C 880 283, 816 254, 848 224" />
    <path class="route-ray route-ray-b" d="M848 224 C 885 215, 847 166, 884 156 C 921 147, 883 98, 920 88" />
    <path class="route-ray route-ray-a" d="M848 224 C 861 188, 799 192, 812 156 C 825 120, 763 124, 776 88" />
    <!-- Kol 2 (-55°, +35° açı) - dallanmıyor, dış çembere tek uçla değiyor -->
    <path class="route-ray route-ray-b" d="M848 400 C 926 390, 861 280, 940 269 C 1018 259, 953 149, 1032 138" />
    <!-- Kol 3 (-15°, +40° açı) - dallanıyor -->
    <path class="route-ray route-ray-a" d="M848 400 C 884 423, 896 354, 933 377 C 969 400, 981 331, 1018 354" />
    <path class="route-ray route-ray-b" d="M1018 354 C 1036 387, 1074 338, 1093 372 C 1111 405, 1149 356, 1168 389" />
    <path class="route-ray route-ray-a" d="M1018 354 C 1056 357, 1036 299, 1075 302 C 1112 305, 1093 247, 1131 250" />
    <!-- Kol 4 (17°, +32° açı) - dallanmıyor -->
    <path class="route-ray route-ray-b" d="M848 400 C 881 471, 966 376, 1001 447 C 1034 518, 1119 423, 1154 494" />
    <!-- Kol 5 (55°, +38° açı) - dallanıyor -->
    <path class="route-ray route-ray-a" d="M848 400 C 838 442, 908 429, 899 472 C 889 514, 958 501, 949 544" />
    <path class="route-ray route-ray-b" d="M949 544 C 924 573, 983 591, 959 621 C 934 650, 993 668, 968 697" />
    <path class="route-ray route-ray-a" d="M949 544 C 959 580, 1007 542, 1018 579 C 1028 615, 1076 577, 1086 614" />
    <!-- Kol 6 (91°, +36° açı) - dallanmıyor -->
    <path class="route-ray route-ray-b" d="M848 400 C 789 452, 904 507, 845 560 C 786 612, 901 667, 842 720" />
    <!-- Kol 7 (124°, +33° açı) - dallanıyor -->
    <path class="route-ray route-ray-a" d="M848 400 C 805 406, 842 466, 799 473 C 756 479, 793 539, 750 546" />
    <path class="route-ray route-ray-b" d="M750 546 C 714 533, 718 595, 682 582 C 646 569, 650 631, 614 618" />
    <path class="route-ray route-ray-a" d="M750 546 C 719 568, 772 600, 742 623 C 711 645, 764 676, 733 699" />
    <!-- Kol 8 (163°, +39° açı) - dallanmıyor -->
    <path class="route-ray route-ray-b" d="M848 400 C 780 360, 764 486, 695 447 C 627 407, 611 533, 542 494" />
    <!-- Kol 9 (197°, +34° açı) - dallanıyor -->
    <path class="route-ray route-ray-a" d="M848 400 C 830 361, 783 414, 764 375 C 746 336, 699 388, 680 349" />
    <path class="route-ray route-ray-b" d="M680 349 C 682 311, 624 333, 626 295 C 628 257, 570 279, 571 240" />
    <path class="route-ray route-ray-a" d="M680 349 C 650 326, 635 386, 605 364 C 575 341, 560 401, 529 378" />
    <!-- Kol 10 (234°, +37° açı, kapanış +36° ile Kol 1'e (270°=-90°) tam dönüyor) - dallanmıyor -->
    <path class="route-ray route-ray-b" d="M848 400 C 864 323, 739 349, 754 271 C 770 194, 645 219, 660 141" />

    <!-- 15 uç nokta - araçları temsil eden parlayan noktalar, HEPSİ R=320 çemberinin üzerinde
         (dallanma noktalarında - 848,224 / 1018,354 / 949,544 / 750,546 / 680,349 - nokta YOK). -->
    <circle class="route-dot" cx="920" cy="88" r="6" />
    <circle class="route-dot" cx="776" cy="88" r="5.5" />
    <circle class="route-dot" cx="1032" cy="138" r="6.5" />
    <circle class="route-dot" cx="1168" cy="389" r="7" />
    <circle class="route-dot" cx="1131" cy="250" r="6" />
    <circle class="route-dot" cx="1154" cy="494" r="7.5" />
    <circle class="route-dot" cx="968" cy="697" r="5.5" />
    <circle class="route-dot" cx="1086" cy="614" r="6" />
    <circle class="route-dot" cx="842" cy="720" r="7" />
    <circle class="route-dot" cx="614" cy="618" r="5.5" />
    <circle class="route-dot" cx="733" cy="699" r="6" />
    <circle class="route-dot" cx="542" cy="494" r="6.5" />
    <circle class="route-dot" cx="571" cy="240" r="5.5" />
    <circle class="route-dot" cx="529" cy="378" r="5" />
    <circle class="route-dot" cx="660" cy="141" r="7" />

    <!-- Pusula logosu - dairesel ağın merkezi, 10 kolun ortak çıkış noktası, mevcut marka
         işaretiyle (bkz. app.html .brand-mark) AYNI SVG yolu, büyütülüp merkeze oturtuldu. -->
    <g class="route-origin" transform="translate(848 400)">
      <circle r="34" class="route-origin-plate" />
      <g class="route-origin-mark" transform="scale(2.4) translate(-12 -12)">
        <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.3" fill="none" />
        <path d="M15.5 8.5 L11 11 L8.5 15.5 L13 13 Z" fill="currentColor" />
      </g>
    </g>
  </svg>

  <!-- Sayfaya özgü form içeriği (.login-form-flat) burada projekte ediliyor. -->
  <ng-content></ng-content>

  <!-- Sol alt köşe: telemetri istatistikleri, formdan ayrı, büyük/dikkat çekici puntoda. -->
  <div class="login-telemetry-flat">
    <div><strong>42</strong>{{ 'authOrtak.telemetriFilo' | translate }}</div>
    <div><strong>2 dk</strong>{{ 'authOrtak.telemetriSenkron' | translate }}</div>
  </div>
</div>
