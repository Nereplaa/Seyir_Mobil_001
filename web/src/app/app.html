<!-- Login ekranı kendi tam-sayfa marka/rota panelini gösteriyor (bkz. login.html) - üstteki
     genel app header'ı TEKRAR bir marka şeridi gibi durup gereksiz yer kaplıyordu (kullanıcı
     geri bildirimi, 2026-08-07: "sil"). ROTAYA göre gizleniyor (auth durumuna göre DEĞİL -
     bkz. app.ts loginEkraninda yorumu, token geçerliyken /login'e gelinebiliyor). -->
@if (!loginEkraninda()) {
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.4" />
        <path d="M15.5 8.5 L11 11 L8.5 15.5 L13 13 Z" fill="currentColor" />
      </svg>
      <!-- 2026-08-13: login ekranındaki iki satırlı "Seyir" üstte / "Mobil" altta marka yazısıyla
           (bkz. login.css .login-wordmark-line) AYNI font/stil - burada sadece header'a sığacak
           kadar küçültülmüş punto ile. -->
      <h1 class="brand-wordmark">
        <span class="brand-line">Seyir</span>
        <span class="brand-line">Mobil</span>
      </h1>
      <span class="brand-sub">Araç Takip</span>
    </div>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ 'nav.hareketler' | translate }}</a>
      <a routerLink="/rapor" routerLinkActive="active">{{ 'nav.rapor' | translate }}</a>
      <a routerLink="/import" routerLinkActive="active">{{ 'nav.import' | translate }}</a>
      @if (auth.role() === 'Admin') {
        <a routerLink="/admin" routerLinkActive="active">{{ 'nav.admin' | translate }}</a>
      }
    </nav>
    <div class="kullanici-bilgisi">
      <!-- Dil secici (feedback_001, coklu dil altyapisi) - su an sadece nav metinleri gercekten
           cevrilmis, geri kalan ekranlar kademeli olarak tasinacak (bkz. services/dil.ts). -->
      <dx-select-box
        class="dil-secici"
        [dataSource]="dilSecenekleri"
        displayExpr="etiket"
        valueExpr="kod"
        [value]="dil.guncelDil"
        (onValueChanged)="dilDegistir($event.value)"
        width="72"
      ></dx-select-box>
      <span class="kullanici-adi">{{ auth.username() }} <span class="kullanici-rol">({{ auth.role() }})</span></span>
      <dx-button [text]="'nav.cikisYap' | translate" stylingMode="outlined" (onClick)="cikisYap()"></dx-button>
    </div>
  </header>
}

<main>
  <router-outlet />
</main>
